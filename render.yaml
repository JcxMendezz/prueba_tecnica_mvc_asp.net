# ===========================================
# Render Blueprint - Task Management System
# ===========================================
# Despliega: Web Service + PostgreSQL Database
# Docs: https://render.com/docs/blueprint-spec

version: "1"

services:
  # ===========================================
  # Web Service (ASP.NET Core)
  # ===========================================
  - type: web
    name: taskflow-web
    runtime: docker
    dockerfilePath: ./dockerfile
    dockerContext: .

    # Plan gratuito
    plan: free

    # Región
    region: oregon

    # Health Check
    healthCheckPath: /health

    # Variables de entorno
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "8080"
      # Conexión a la base de datos (referencia al servicio de BD)
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      # Variables individuales de BD (alternativa)
      - key: DB_HOST
        fromDatabase:
          name: taskflow-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: taskflow-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: taskflow-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: taskflow-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: taskflow-db
          property: password

  # ===========================================
  # PostgreSQL Database
  # ===========================================
databases:
  - name: taskflow-db
    plan: free
    region: oregon
    databaseName: task_management
    user: taskflow_user
    ipAllowList: [] # Permitir todas las IPs (necesario para plan free)
